name: Run Jest Tests

on:
  push:
    branches: [main] # ou 'master'
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20" # ou ta version préférée

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test
